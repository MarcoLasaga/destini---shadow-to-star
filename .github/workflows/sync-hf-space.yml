name: Sync ML Service to Hugging Face Space
on:
  push:
    branches: [ main, master ]
    paths:
      - 'ml-service/**'
      - '.github/workflows/sync-hf-space.yml'
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install huggingface_hub
        run: pip install --upgrade huggingface_hub

      - name: Upload ml-service folder to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c '
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path="ml-service",
              repo_id="jdyyy1/stylesense-ml",
              repo_type="space",
              commit_message="Auto-sync ml-service from GitHub"
          )
          print("Successfully synced ml-service to jdyyy1/stylesense-ml!")
          '
