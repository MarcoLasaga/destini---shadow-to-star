<text id="Hero_Title" x="187.5" y="448" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#24152C" text-anchor="middle" letter-spacing="-0.6">Let's make getting dressed</text>
<text id="Hero_Title_2" x="187.5" y="474" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#24152C" text-anchor="middle" letter-spacing="-0.6">feel easy.</text>
<text id="Hero_Body" x="187.5" y="514" font-family="Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5E4B6B" text-anchor="middle"><tspan x="187.5">A little about your style helps us turn your</tspan><tspan x="187.5" dy="19">wardrobe into outfits you’ll actually want to wear.</tspan></text>
</g>
<g id="Get_Started_CTA">
