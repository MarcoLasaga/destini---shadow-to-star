</g>
<text id="Button_Label" x="124.8" y="756.22" font-family="Arial, sans-serif" font-size="14.5" font-weight="800" fill="#24152C">Let's get started</text>
</g>
<rect id="Home_Indicator" x="120.5" y="799" width="134" height="5" rx="2.5" fill="#24152C"/>
